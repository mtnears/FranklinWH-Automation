version: '3.8'

# ==============================================================================
# FranklinWH Battery Automation - Docker Compose Configuration
# ==============================================================================
# 
# Usage:
#   docker compose build                    # Build the image
#   docker compose run --rm franklin        # Run automation once
#   docker compose up -d                    # Start continuous mode (if using scheduler)
#
# Configuration:
#   Copy .env.example to .env and customize settings
#
# ==============================================================================

services:
  franklin-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franklin-automation
    
    # Environment configuration
    env_file:
      - .env
    
    # Volume mounts for persistent data
    volumes:
      # Logs directory (persistent across container restarts)
      - ./logs:/app/logs
      
      # Data directory for savings tracking
      - ./data:/app/data
      
      # Optional: Mount scripts for development/testing
      # Uncomment to edit scripts without rebuilding:
      # - ./scripts:/app/scripts:ro
    
    # Network configuration
    # The container needs internet access for Franklin Cloud API
    # and optionally for dynamic pricing APIs
    network_mode: bridge
    
    # Timezone (from .env)
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    
    # Resource limits (optional, adjust as needed)
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    
    # Default command: run smart_decision.py once
    # For scheduled execution, use external scheduler (cron/Task Scheduler)
    command: python /app/scripts/smart_decision.py
    
    # Restart policy
    # - "no": Don't restart (use with external scheduler)
    # - "unless-stopped": Always restart (use with internal scheduler)
    restart: "no"

  # ==============================================================================
  # Optional: Dashboard data generator
  # ==============================================================================
  # Uncomment to run dashboard updates via Docker
  #
  # dashboard:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: franklin-dashboard
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./data:/app/data
  #     - ${WEB_DIR:-/volume1/web}:/app/web
  #   command: python /app/scripts/generate_dashboard_data.py
  #   restart: "no"

  # ==============================================================================
  # Optional: Weekly chart generator
  # ==============================================================================
  # Uncomment to run chart generation via Docker
  #
  # charts:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: franklin-charts
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./logs:/app/logs
  #     - ${WEB_DIR:-/volume1/web}:/app/web
  #   command: python /app/scripts/generate_weekly_charts.py
  #   restart: "no"

# ==============================================================================
# Volume definitions (for named volumes if preferred)
# ==============================================================================
# Uncomment to use named volumes instead of bind mounts:
#
# volumes:
#   franklin-logs:
#   franklin-data:
