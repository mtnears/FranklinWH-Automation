# ==============================================================================
# FranklinWH Battery Automation - Docker Compose
# ==============================================================================
#
# Complete automation system with:
#   - Automated battery management (every 15 minutes)
#   - Dashboard data generation (every minute)
#   - Weather collection (if enabled)
#   - PVOutput tracking (if enabled)
#   - Weekly performance charts
#   - Built-in web dashboard server
#
# Quick Start:
#   1. Copy .env.example to .env and configure
#   2. docker compose build
#   3. docker compose up -d
#   4. Access dashboard at http://YOUR-IP:8100 (or custom DASHBOARD_PORT)
#
# ==============================================================================

services:
  # ============================================================================
  # Main Automation Service
  # ============================================================================
  franklin-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franklin-automation
    
    # Load configuration from .env file
    env_file:
      - .env
    
    # Persistent storage
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./web:/app/web
    
    # Timezone support
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    
    # Always restart unless explicitly stopped
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Web Dashboard Server (Built-in)
  # ============================================================================
  franklin-dashboard:
    image: nginx:alpine
    container_name: franklin-dashboard
    
    # Dashboard port - configurable via .env (default: 8100)
    ports:
      - "${DASHBOARD_PORT:-8100}:80"
    
    # Mount web files and logs (for charts)
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./logs:/logs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    
    # Timezone
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    
    # Depends on automation to generate data
    depends_on:
      - franklin-automation
    
    # Always restart
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ==============================================================================
# Notes:
# ==============================================================================
#
# Logs and Data:
#   - Logs are stored in ./logs (mounted from host)
#   - Data files are stored in ./data (mounted from host)
#   - Dashboard files are in ./web (mounted from host)
#
# Dashboard Access:
#   - Open http://YOUR-SERVER-IP:8100 in a browser (or custom DASHBOARD_PORT)
#   - Dashboard auto-refreshes every 15 seconds
#   - Weekly charts available in the Reports tab
#
# Monitoring:
#   - View logs: docker compose logs -f franklin-automation
#   - Check status: docker compose ps
#   - Restart: docker compose restart
#
# Stopping:
#   - Stop all: docker compose down
#   - Stop and remove data: docker compose down -v
#
# ==============================================================================
